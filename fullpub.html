<!DOCTYPE HTML>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Full Publications - Yibiao YANG @ Nanjing University (杨已彪-南京大学)</title>

  <meta name="author" content="Yibiao YANG">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="shortcut icon" href="./files/about/YibiaoYANG.ico">
  <link rel="stylesheet" type="text/css" href="css/stylesheet.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet">
</head>

<body>
  <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">
    🌙
  </button>

  <nav class="main-nav">
    <div class="nav-container">
      <a href="./">← Home</a>
    </div>
  </nav>

  <div class="container">
    <section>
      <h2><i class="fas fa-scroll"></i> Full Publications</h2>
      <p style="font-size: 0.85rem; color: #888; margin: -0.5rem 0 0.5rem;">* Corresponding author; † Equal contribution.</p>
      <div id="paper"></div>
    </section>
  </div>

  <script>
    // Theme toggle functionality (same as homepage)
    document.addEventListener('DOMContentLoaded', function() {
      const themeToggle = document.getElementById('theme-toggle');
      const prefersDarkScheme = window.matchMedia('(prefers-color-scheme: dark)');
      const currentTheme = localStorage.getItem('theme') || (prefersDarkScheme.matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', currentTheme);
      updateThemeIcon(currentTheme);
      themeToggle.addEventListener('click', function() {
        const theme = document.documentElement.getAttribute('data-theme');
        const newTheme = theme === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
        updateThemeIcon(newTheme);
      });
      function updateThemeIcon(theme) {
        themeToggle.textContent = theme === 'dark' ? '☀️' : '🌙';
      }
    });
  </script>
  <script type="text/javascript" src="js/paper_display_full.js"></script>
</body>

</html>
