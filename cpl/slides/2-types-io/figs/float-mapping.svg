<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 430" font-family="Helvetica, Arial, 'Noto Sans SC', sans-serif">
  <defs>
    <marker id="fm-arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#586e75"/>
    </marker>
    <marker id="fm-red" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#dc322f"/>
    </marker>
  </defs>

  <text x="300" y="30" font-size="22" font-weight="bold" fill="#073642" text-anchor="middle">可表示的浮点数 = 数轴上的"刻度"</text>
  <text x="300" y="58" font-size="16" fill="#586e75" text-anchor="middle">有效数字位数固定；指数越大，相邻刻度的间隔按 2 的幂翻倍</text>

  <!-- 数轴 -->
  <line x1="30" y1="220" x2="560" y2="220" stroke="#586e75" stroke-width="2.5" marker-end="url(#fm-arr)"/>

  <!-- 主刻度: 位置按倍增间隔: gaps 30,60,120,240 -->
  <g stroke="#586e75" stroke-width="2">
    <line x1="40"  y1="206" x2="40"  y2="234"/>
    <line x1="70"  y1="206" x2="70"  y2="234"/>
    <line x1="130" y1="206" x2="130" y2="234"/>
    <line x1="250" y1="206" x2="250" y2="234"/>
    <line x1="490" y1="206" x2="490" y2="234"/>
  </g>
  <g font-size="15" fill="#586e75" text-anchor="middle">
    <text x="40"  y="256">0.5</text>
    <text x="70"  y="256">1</text>
    <text x="130" y="256">2</text>
    <text x="250" y="256">4</text>
    <text x="490" y="256">8</text>
    <text x="556" y="256">…</text>
  </g>

  <!-- 次刻度: 每段四等分, 展示刻度密度由密到疏 -->
  <g stroke="#93a1a1" stroke-width="1.4">
    <!-- 40..70 -->
    <line x1="47.5" y1="212" x2="47.5" y2="228"/><line x1="55" y1="212" x2="55" y2="228"/><line x1="62.5" y1="212" x2="62.5" y2="228"/>
    <!-- 70..130 -->
    <line x1="85" y1="212" x2="85" y2="228"/><line x1="100" y1="212" x2="100" y2="228"/><line x1="115" y1="212" x2="115" y2="228"/>
    <!-- 130..250 -->
    <line x1="160" y1="212" x2="160" y2="228"/><line x1="190" y1="212" x2="190" y2="228"/><line x1="220" y1="212" x2="220" y2="228"/>
    <!-- 250..490 -->
    <line x1="310" y1="212" x2="310" y2="228"/><line x1="370" y1="212" x2="370" y2="228"/><line x1="430" y1="212" x2="430" y2="228"/>
  </g>

  <!-- 间隔翻倍标注 -->
  <g stroke="#b58900" stroke-width="1.6" fill="#b58900" font-size="14">
    <line x1="40" y1="180" x2="70" y2="180" marker-end="url(#fm-arr)"/>
    <text x="55" y="172" text-anchor="middle">间隔 1×</text>
    <line x1="130" y1="140" x2="250" y2="140" marker-end="url(#fm-arr)"/>
    <text x="190" y="132" text-anchor="middle">间隔 ×2</text>
    <line x1="250" y1="180" x2="490" y2="180" marker-end="url(#fm-arr)"/>
    <text x="370" y="172" text-anchor="middle">间隔 ×4</text>
  </g>

  <!-- 左侧"密"标注, 右侧"稀"标注 -->
  <text x="52" y="300" font-size="15" fill="#268bd2" text-anchor="start">0 附近: 刻度很密</text>
  <text x="300" y="300" font-size="15" fill="#cb4b16" text-anchor="middle">越远越稀: 同一个真实值离刻度更远</text>
  <text x="548" y="300" font-size="15" fill="#cb4b16" text-anchor="end">远处: 一个大格子</text>

  <!-- 真实值落在刻度之间: 只能就近舍入 -->
  <circle cx="390" cy="220" r="6" fill="#dc322f"/>
  <line x1="390" y1="214" x2="390" y2="196" stroke="#dc322f" stroke-width="1.6" marker-end="url(#fm-red)"/>
  <text x="390" y="188" font-size="15" fill="#dc322f" text-anchor="middle">真实值</text>
  <text x="390" y="332" font-size="15" fill="#dc322f" text-anchor="middle">落在刻度之间 → 只能存成最近的刻度 (近似)</text>

  <text x="300" y="380" font-size="19" font-weight="bold" fill="#073642" text-anchor="middle">32 位只有 2³² ≈ 42.9 亿个图案, 数轴上的数却无穷多</text>
  <text x="300" y="408" font-size="16" fill="#586e75" text-anchor="middle">所以浮点是近似存储: 0.1 存进去时就被舍入了一次</text>
</svg>
