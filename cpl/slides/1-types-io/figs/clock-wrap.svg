<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 520" font-family="Helvetica, Arial, sans-serif">
  <!-- 顶部: 边界放大条 -->
  <text x="220" y="26" fill="#268bd2" font-size="28" text-anchor="middle" font-weight="bold">12 点往两边各拨一格:</text>
  <circle cx="170" cy="62" r="5" fill="#586e75"/>
  <circle cx="220" cy="62" r="6" fill="#cb4b16"/>
  <circle cx="270" cy="62" r="5" fill="#586e75"/>
  <text x="170" y="90" fill="#586e75" font-size="22" text-anchor="middle">11</text>
  <text x="220" y="90" fill="#cb4b16" font-size="22" text-anchor="middle" font-weight="bold">12</text>
  <text x="270" y="90" fill="#586e75" font-size="22" text-anchor="middle">1</text>
  <defs>
    <marker id="arrow" markerWidth="18" markerHeight="18" refX="14" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 18 4 L 0 8 Z" fill="#268bd2"/>
    </marker>
  </defs>
  <!-- 12 -> 1 (向右) 与 12 -> 11 (向左), 尖箭头 -->
  <line x1="238" y1="62" x2="258" y2="62" stroke="#268bd2" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="202" y1="62" x2="182" y2="62" stroke="#268bd2" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/>
  <!-- 表盘 -->
  <circle cx="220" cy="260" r="150" fill="#fdf6e3" stroke="#586e75" stroke-width="6"/>
  <circle cx="220" cy="260" r="7" fill="#586e75"/>
  <g stroke="#586e75" stroke-width="4">
    <line x1="292" y1="135" x2="301" y2="120"/>
    <line x1="345" y1="188" x2="360" y2="179"/>
    <line x1="364" y1="260" x2="382" y2="260"/>
    <line x1="345" y1="332" x2="360" y2="341"/>
    <line x1="292" y1="385" x2="301" y2="400"/>
    <line x1="220" y1="404" x2="220" y2="422"/>
    <line x1="148" y1="385" x2="139" y2="400"/>
    <line x1="95" y1="332" x2="80" y2="341"/>
    <line x1="76" y1="260" x2="58" y2="260"/>
    <line x1="95" y1="188" x2="80" y2="179"/>
    <line x1="148" y1="135" x2="139" y2="120"/>
    <line x1="220" y1="116" x2="220" y2="98"/>
  </g>
  <g font-size="34" text-anchor="middle" font-weight="bold">
    <text x="220" y="152" fill="#586e75">12</text>
    <text x="340" y="272" fill="#586e75">3</text>
    <text x="220" y="392" fill="#586e75">6</text>
    <text x="100" y="272" fill="#586e75">9</text>
  </g>
  <g font-size="28" text-anchor="middle" font-weight="bold">
    <text x="280" y="168" fill="#93a1a1">1</text>
    <text x="324" y="212" fill="#93a1a1">2</text>
    <text x="324" y="332" fill="#93a1a1">4</text>
    <text x="280" y="376" fill="#93a1a1">5</text>
    <text x="160" y="376" fill="#93a1a1">7</text>
    <text x="116" y="332" fill="#93a1a1">8</text>
    <text x="116" y="212" fill="#93a1a1">10</text>
    <text x="160" y="168" fill="#93a1a1">11</text>
  </g>
  <text x="220" y="500" fill="#cb4b16" font-size="30" text-anchor="middle" font-weight="bold">INT_MAX + 1 = INT_MIN</text>
</svg>