<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 460" font-family="Helvetica, Arial, sans-serif">
  <!-- 表盘 -->
  <circle cx="220" cy="210" r="180" fill="#fdf6e3" stroke="#586e75" stroke-width="6"/>
  <circle cx="220" cy="210" r="8" fill="#586e75"/>
  <!-- 刻度与数字 -->
  <g stroke="#586e75" stroke-width="4">
    <line x1="220" y1="40" x2="220" y2="62"/>
    <line x1="390" y1="210" x2="368" y2="210"/>
    <line x1="220" y1="380" x2="220" y2="358"/>
    <line x1="50" y1="210" x2="72" y2="210"/>
    <line x1="364" y1="66" x2="350" y2="80"/>
    <line x1="364" y1="354" x2="350" y2="340"/>
    <line x1="76" y1="354" x2="90" y2="340"/>
    <line x1="76" y1="66" x2="90" y2="80"/>
  </g>
  <g fill="#586e75" font-size="40" text-anchor="middle" font-weight="bold">
    <text x="220" y="86">12</text>
    <text x="368" y="226">3</text>
    <text x="220" y="396">6</text>
    <text x="72" y="226">9</text>
  </g>
  <g fill="#93a1a1" font-size="30" text-anchor="middle" font-weight="bold">
    <text x="305" y="118">1</text>
    <text x="135" y="118">11</text>
    <text x="305" y="322">4</text>
    <text x="135" y="322">8</text>
    <text x="220" y="172">2</text>
    <text x="220" y="262">5</text>
    <text x="146" y="256">10</text>
    <text x="294" y="256">7</text>
  </g>
  <!-- 绕圈箭头: 11 点 -> 12 -> 1 -->
  <path d="M 150 96 A 168 168 0 0 1 290 96" fill="none" stroke="#268bd2" stroke-width="8"
        stroke-linecap="round" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="10" refY="6"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 14 6 L 0 12 Z" fill="#268bd2"/>
    </marker>
  </defs>
  <text x="220" y="58" fill="#268bd2" font-size="34" text-anchor="middle" font-weight="bold">11 点 + 2 小时 = 1 点</text>
  <!-- int 类比 -->
  <text x="220" y="446" fill="#cb4b16" font-size="30" text-anchor="middle" font-weight="bold">INT_MAX + 1 = INT_MIN</text>
</svg>
